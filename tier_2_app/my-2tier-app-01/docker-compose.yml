version: "3.8"
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    image: docker pull hritikraj8804/my-2tier-app-01-backend
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    image: docker pull hritikraj8804/my-2tier-app-01-frontend